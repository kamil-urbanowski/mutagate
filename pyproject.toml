[project]
name = "mutagate"
version = "0.1.0"
description = "Mutation-gated test generation for Java test suites"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    # Pinned: the parser decides what code the model is shown.
    "tree-sitter==0.26.0",
    "tree-sitter-java==0.23.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# The local model's runtime, Apple Silicon only. Pinned, like the parser: it
# shapes the local model's replies.
local = [
    "mlx-lm==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.scripts]
mutagate = "mutagate.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "integration: real builds and PIT runs; skipped unless MUTAGATE_INTEGRATION=1",
    "local_model: the real local model; skipped unless MUTAGATE_LOCAL_MODEL=1",
]

[tool.ruff]
line-length = 100
